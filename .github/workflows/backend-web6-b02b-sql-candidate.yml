name: WEB6 protected SQL B02b candidate

# Explicit Owner opt-in. The tag must point at the exact reviewed PR HEAD.
on:
  push:
    tags: ['web6-b02b-sql-candidate-*']

permissions:
  contents: read

concurrency:
  group: web6-b02b-sql-candidate
  cancel-in-progress: false

jobs:
  b02b-sql-candidate:
    if: >-
      github.repository_id == '1409766698' && github.actor == 'chung6a8m' &&
      github.triggering_actor == 'chung6a8m' && github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/web6-b02b-sql-candidate-')
    environment: web5-sql-candidate
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      MYDMSVN_TEST_SQLSERVER_CONNECTION_STRING: ''
    steps:
      - name: Set private and sanitized evidence paths
        run: |
          "WEB6_STATE=$env:RUNNER_TEMP/web6-b02b-sql-state.json" >> $env:GITHUB_ENV
          "WEB6_RAW=$env:RUNNER_TEMP/web6-b02b-sql-raw" >> $env:GITHUB_ENV
          "WEB6_SAFE=$env:RUNNER_TEMP/web6-b02b-sql-safe" >> $env:GITHUB_ENV
      - name: Checkout exact reviewed control commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Checkout exact reviewed B02b source and tests
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '8.0.x'
      - name: Verify exact candidate and evidence guard
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path $env:WEB6_RAW,$env:WEB6_SAFE | Out-Null
          if ((git -C candidate rev-parse HEAD) -ne $env:GITHUB_SHA -or $LASTEXITCODE -ne 0) { throw 'Candidate pin mismatch.' }
          if ((git -C control rev-parse HEAD) -ne $env:GITHUB_SHA -or $LASTEXITCODE -ne 0) { throw 'Control pin mismatch.' }
          & ./control/.github/scripts/Test-Web5SqlEvidence.ps1
          if ((git -C candidate rev-parse HEAD:docs/contracts/web4-v1) -ne 'fcab4a1e7505b150a132ce2899002930e9f2a6ee' -or $LASTEXITCODE -ne 0) { throw 'Frozen WEB4 corpus changed.' }
      - name: Allocate private SID-owned SQL instance
        shell: powershell
        run: |
          & ./control/.github/scripts/Web5SqlInstance.ps1 -Action Initialize -StatePath $env:WEB6_STATE -SummaryPath "$env:WEB6_SAFE/instance.json" -TestSourceSha $env:GITHUB_SHA
      - name: Require hosted LocalDB SQL-login capability
        run: |
          $ErrorActionPreference='Stop'
          $connection=New-Object System.Data.SqlClient.SqlConnection($env:MYDMSVN_TEST_SQLSERVER_CONNECTION_STRING)
          try {
            $connection.Open()
            $command=$connection.CreateCommand(); $command.CommandTimeout=3
            $command.CommandText="SELECT CONVERT(int,SERVERPROPERTY('IsLocalDB')),CONVERT(int,SERVERPROPERTY('IsIntegratedSecurityOnly'));"
            $reader=$command.ExecuteReader()
            if (-not $reader.Read() -or $reader.GetInt32(0) -ne 1 -or $reader.GetInt32(1) -ne 0) { throw 'Owned LocalDB cannot exercise restricted SQL-login CLI.' }
            $reader.Close()
            [IO.File]::WriteAllText("$env:WEB6_SAFE/capability.json",'{"localDb":true,"sqlAuthenticationEnabled":true}'+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          } finally { $connection.Dispose() }
      - name: Restore and build exact Release net48 candidate
        working-directory: candidate
        run: |
          $ErrorActionPreference='Stop'
          $project='tests/MyDmsVn.Server.Infrastructure.Security.Tests/MyDmsVn.Server.Infrastructure.Security.Tests.csproj'
          dotnet restore $project --locked-mode *> "$env:WEB6_RAW/restore.log"
          if ($LASTEXITCODE -ne 0) { throw 'B02b locked restore failed; raw output withheld.' }
          dotnet build $project -c Release -f net48 --no-restore *> "$env:WEB6_RAW/build.log"
          if ($LASTEXITCODE -ne 0) { throw 'B02b Release/net48 build failed; raw output withheld.' }
      - name: Run exact B02b CLI decision class
        timeout-minutes: 10
        working-directory: candidate
        run: |
          $ErrorActionPreference='Stop'; . ../control/.github/scripts/Assert-Web5SqlEvidence.ps1
          [IO.File]::WriteAllText($env:WEB6_STATE+'.active','B02b-decision')
          $project='tests/MyDmsVn.Server.Infrastructure.Security.Tests/MyDmsVn.Server.Infrastructure.Security.Tests.csproj'
          $class='MyDmsVn.Server.Infrastructure.IntegrationTests.WebOperationOperatorDecisionTests'; $filter='FullyQualifiedName~'+$class
          dotnet test $project -c Release -f net48 --no-build --no-restore --list-tests --filter $filter *> "$env:WEB6_RAW/decision-discovery.log"
          if ($LASTEXITCODE -ne 0) { throw 'Decision discovery failed.' }
          dotnet test $project -c Release -f net48 --no-build --no-restore --filter $filter --blame-hang-timeout 90s --blame-hang-dump-type none --logger 'trx;LogFileName=decision.trx' --results-directory $env:WEB6_RAW *> "$env:WEB6_RAW/decision-run.log"
          $testExit=$LASTEXITCODE
          Assert-Web5SqlEvidence -TrxPath "$env:WEB6_RAW/decision.trx" -DiscoveryPath "$env:WEB6_RAW/decision-discovery.log" -RequiredClasses @('WebOperationOperatorDecisionTests') -SummaryPath "$env:WEB6_SAFE/decision.json" -Label B02bDecision
          $summary=Get-Content "$env:WEB6_SAFE/decision.json" -Raw | ConvertFrom-Json
          if ($summary.total -ne 41 -or $summary.executed -ne 41 -or $summary.passed -ne 41 -or $summary.failed -ne 0 -or $summary.skipped -ne 0 -or $summary.requiredClasses.WebOperationOperatorDecisionTests -ne 41) { throw 'Exactly 41 decision cases must pass.' }
          $summary | Add-Member -NotePropertyName retry -NotePropertyValue 0; [IO.File]::WriteAllText("$env:WEB6_SAFE/decision.json",($summary|ConvertTo-Json -Depth 5 -Compress)+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          if ($testExit -ne 0) { throw 'Decision test process failed.' }
      - name: Run exact terminal resolution and OS interruption regression
        timeout-minutes: 10
        working-directory: candidate
        run: |
          $ErrorActionPreference='Stop'; . ../control/.github/scripts/Assert-Web5SqlEvidence.ps1
          $project='tests/MyDmsVn.Server.Infrastructure.Security.Tests/MyDmsVn.Server.Infrastructure.Security.Tests.csproj'
          $filter='FullyQualifiedName~WebOperationResolutionTests|FullyQualifiedName~WebOperationTerminalCrashTests'
          dotnet test $project -c Release -f net48 --no-build --no-restore --list-tests --filter $filter *> "$env:WEB6_RAW/resolution-discovery.log"
          if ($LASTEXITCODE -ne 0) { throw 'Resolution/crash discovery failed.' }
          dotnet test $project -c Release -f net48 --no-build --no-restore --filter $filter --blame-hang-timeout 90s --blame-hang-dump-type none --logger 'trx;LogFileName=resolution.trx' --results-directory $env:WEB6_RAW *> "$env:WEB6_RAW/resolution-run.log"
          $testExit=$LASTEXITCODE
          Assert-Web5SqlEvidence -TrxPath "$env:WEB6_RAW/resolution.trx" -DiscoveryPath "$env:WEB6_RAW/resolution-discovery.log" -RequiredClasses @('WebOperationResolutionTests','WebOperationTerminalCrashTests') -SummaryPath "$env:WEB6_SAFE/resolution.json" -Label B02bResolution
          $summary=Get-Content "$env:WEB6_SAFE/resolution.json" -Raw | ConvertFrom-Json
          if ($summary.total -ne 26 -or $summary.passed -ne 26 -or $summary.failed -ne 0 -or $summary.skipped -ne 0) { throw 'Exactly 26 resolution/crash cases must pass.' }
          $summary | Add-Member -NotePropertyName retry -NotePropertyValue 0; [IO.File]::WriteAllText("$env:WEB6_SAFE/resolution.json",($summary|ConvertTo-Json -Depth 5 -Compress)+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          if ($testExit -ne 0) { throw 'Resolution/crash test process failed.' }
      - name: Run exact two six-kind B04 fence regressions
        timeout-minutes: 10
        working-directory: candidate
        run: |
          $ErrorActionPreference='Stop'; . ../control/.github/scripts/Assert-Web5SqlEvidence.ps1
          $project='tests/MyDmsVn.Server.Infrastructure.Security.Tests/MyDmsVn.Server.Infrastructure.Security.Tests.csproj'
          $one='MyDmsVn.Server.Infrastructure.IntegrationTests.WebOperationHttpSqlTests.Operator_first_cancelled_blocks_delayed_original_and_resend_for_all_six_commands'
          $two='MyDmsVn.Server.Infrastructure.IntegrationTests.WebOperationHttpSqlTests.Original_first_commit_remains_authoritative_over_waiting_operator_for_all_six_commands'
          $filter="FullyQualifiedName=$one|FullyQualifiedName=$two"
          dotnet test $project -c Release -f net48 --no-build --no-restore --list-tests --filter $filter *> "$env:WEB6_RAW/races-discovery.log"
          if ($LASTEXITCODE -ne 0) { throw 'Race discovery failed.' }
          dotnet test $project -c Release -f net48 --no-build --no-restore --filter $filter --blame-hang-timeout 180s --blame-hang-dump-type none --logger 'trx;LogFileName=races.trx' --results-directory $env:WEB6_RAW *> "$env:WEB6_RAW/races-run.log"
          $testExit=$LASTEXITCODE
          Assert-Web5SqlEvidence -TrxPath "$env:WEB6_RAW/races.trx" -DiscoveryPath "$env:WEB6_RAW/races-discovery.log" -RequiredClasses @('WebOperationHttpSqlTests') -SummaryPath "$env:WEB6_SAFE/races.json" -Label B02bRaces
          $summary=Get-Content "$env:WEB6_SAFE/races.json" -Raw | ConvertFrom-Json
          if ($summary.total -ne 2 -or $summary.passed -ne 2 -or $summary.failed -ne 0 -or $summary.skipped -ne 0) { throw 'Exactly two allowlisted six-kind races must pass.' }
          $summary | Add-Member -NotePropertyName retry -NotePropertyValue 0; [IO.File]::WriteAllText("$env:WEB6_SAFE/races.json",($summary|ConvertTo-Json -Depth 5 -Compress)+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          if ($testExit -ne 0) { throw 'Race test process failed.' }
          Remove-Item -LiteralPath ($env:WEB6_STATE+'.active')
          & ../control/.github/scripts/Web5SqlInstance.ps1 -Action Check -StatePath $env:WEB6_STATE -SummaryPath "$env:WEB6_SAFE/instance.json" -TestSourceSha $env:GITHUB_SHA
      - name: Verify exact candidate source remained unchanged
        run: |
          git -C candidate diff --exit-code --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed candidate source changed.' }
      - name: Prove ownership and drain before instance removal
        if: ${{ always() }}
        shell: powershell
        timeout-minutes: 2
        run: |
          & ./control/.github/scripts/Web5SqlInstance.ps1 -Action Complete -StatePath $env:WEB6_STATE -SummaryPath "$env:WEB6_SAFE/instance.json" -TestSourceSha $env:GITHUB_SHA
      - name: Require exact evidence and clean lifecycle
        if: ${{ always() }}
        run: |
          $instance=Get-Content "$env:WEB6_SAFE/instance.json" -Raw|ConvertFrom-Json
          $decision=Get-Content "$env:WEB6_SAFE/decision.json" -Raw|ConvertFrom-Json
          $resolution=Get-Content "$env:WEB6_SAFE/resolution.json" -Raw|ConvertFrom-Json
          $races=Get-Content "$env:WEB6_SAFE/races.json" -Raw|ConvertFrom-Json
          if ($instance.phase -ne 'Removed' -or $instance.quarantine -or -not $instance.instanceOwnershipVerified -or $instance.userDatabases -ne 0 -or $instance.activeOwners -ne 0) { throw 'SQL lifecycle was not proven clean.' }
          if ($instance.controlSha -ne $env:GITHUB_SHA -or $instance.testSourceSha -ne $env:GITHUB_SHA) { throw 'Evidence SHA mismatch.' }
          if ($decision.retry -ne 0 -or $resolution.retry -ne 0 -or $races.retry -ne 0) { throw 'Retries are forbidden.' }
          'B02b: decision 41/41; resolution/crash 26/26; races 2/2; zero fail/skip/retry; owned cleanup required.' >> $env:GITHUB_STEP_SUMMARY
      - name: Publish sanitized evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web6-b02b-sql-candidate-counts
          path: ${{ env.WEB6_SAFE }}/*.json
          if-no-files-found: error
          retention-days: 14
